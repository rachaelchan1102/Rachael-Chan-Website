<svg viewBox="0 0 980 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7a8aa8"/>
    </marker>
  </defs>

  <rect width="980" height="460" fill="#ffffff"/>

  <text x="90" y="35" font-size="15" font-weight="600" letter-spacing="1.5" fill="#4a5a80">PROGRAM MATCHING</text>

  <!-- shared input row -->
  <rect x="290" y="55" width="200" height="50" rx="8" fill="#ffffff" stroke="#c7cfdd" stroke-width="1.5"/>
  <text x="390" y="85" font-size="15" text-anchor="middle" fill="#26293b">"Computer Engineering"</text>

  <rect x="510" y="55" width="200" height="50" rx="8" fill="#ffffff" stroke="#c7cfdd" stroke-width="1.5"/>
  <text x="610" y="85" font-size="15" text-anchor="middle" fill="#26293b">"Engineering, Computer"</text>

  <!-- clean bracket connecting both inputs, then a single fork down to each path -->
  <path d="M 390 105 L 390 118 L 610 118 L 610 105" fill="none" stroke="#c7cfdd" stroke-width="1.5"/>
  <line x1="500" y1="118" x2="500" y2="140" stroke="#c7cfdd" stroke-width="1.5"/>

  <line x1="500" y1="140" x2="230" y2="148" stroke="#c7cfdd" stroke-width="1.5"/>
  <line x1="500" y1="140" x2="730" y2="148" stroke="#c7cfdd" stroke-width="1.5"/>

  <!-- LEFT: exact match path -->
  <text x="230" y="130" font-size="14.5" font-weight="600" text-anchor="middle" fill="#8a90a5">EXACT STRING MATCH</text>

  <rect x="90" y="150" width="280" height="55" rx="8" fill="#f7f2f2" stroke="#d9b6b6" stroke-width="1.5"/>
  <text x="230" y="172" font-size="14" text-anchor="middle" fill="#26293b">Compares characters in order</text>
  <text x="230" y="190" font-size="14" text-anchor="middle" fill="#26293b">word order must match exactly</text>

  <line x1="230" y1="205" x2="230" y2="235" stroke="#c9a0a0" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="90" y="238" width="280" height="55" rx="8" fill="#faf0f0" stroke="#d9b6b6" stroke-width="1.5"/>
  <text x="230" y="260" font-size="15" font-weight="600" text-anchor="middle" fill="#a04a4a">No match</text>
  <text x="230" y="278" font-size="13.5" text-anchor="middle" fill="#8a5555">strings differ in word order</text>

  <!-- RIGHT: token-set path -->
  <text x="730" y="130" font-size="14.5" font-weight="600" text-anchor="middle" fill="#4a5a80">TOKEN-SET SIMILARITY</text>

  <rect x="590" y="150" width="280" height="55" rx="8" fill="#eef1f8" stroke="#7a8aa8" stroke-width="1.5"/>
  <text x="730" y="172" font-size="14" text-anchor="middle" fill="#26293b">Breaks into word tokens:</text>
  <text x="730" y="190" font-size="14" text-anchor="middle" fill="#26293b">{computer, engineering}</text>

  <line x1="730" y1="205" x2="730" y2="235" stroke="#7a8aa8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="590" y="238" width="280" height="55" rx="8" fill="#eef1f8" stroke="#7a8aa8" stroke-width="1.5"/>
  <text x="730" y="260" font-size="14" text-anchor="middle" fill="#26293b">Compares token overlap</text>
  <text x="730" y="278" font-size="14" text-anchor="middle" fill="#26293b">(intersection ÷ union)</text>

  <line x1="730" y1="293" x2="730" y2="323" stroke="#7a8aa8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="590" y="326" width="280" height="55" rx="8" fill="#eef8f0" stroke="#8fc4a3" stroke-width="1.5"/>
  <text x="730" y="348" font-size="15" font-weight="600" text-anchor="middle" fill="#2e7d4f">Match, score 1.0</text>
  <text x="730" y="366" font-size="13.5" text-anchor="middle" fill="#4a8f63">same words, order doesn't matter</text>

  <!-- threshold callout spanning bottom -->
  <g>
    <rect x="90" y="400" width="800" height="50" rx="8" fill="#ffffff" stroke="#d8dce6" stroke-width="1.5"/>
    <text x="490" y="430" font-size="14.5" text-anchor="middle" fill="#5a6178">Scores above a high-confidence threshold are accepted automatically. Scores below it fall to override logic to decide.</text>
  </g>

</svg>
