<svg viewBox="0 0 980 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7a8aa8"/>
    </marker>
  </defs>

  <rect width="980" height="470" fill="#ffffff"/>

  <text x="40" y="35" font-size="13" font-weight="600" letter-spacing="1.5" fill="#4a5a80">SPEECH TIMELINE</text>

  <line x1="40" y1="90" x2="940" y2="90" stroke="#d8dce6" stroke-width="2"/>

  <rect x="40" y="70" width="140" height="40" rx="6" fill="#eef1f8" stroke="#7a8aa8" stroke-width="1.5"/>
  <text x="110" y="95" font-size="12.5" text-anchor="middle" fill="#26293b">"I have an"</text>

  <rect x="210" y="70" width="150" height="40" rx="6" fill="#eef1f8" stroke="#7a8aa8" stroke-width="1.5"/>
  <text x="285" y="95" font-size="12.5" text-anchor="middle" fill="#26293b">"appointment"</text>

  <line x1="385" y1="90" x2="385" y2="128" stroke="#c7cfdd" stroke-width="1.5" stroke-dasharray="3,3"/>

  <rect x="410" y="70" width="70" height="40" rx="6" fill="#eef1f8" stroke="#7a8aa8" stroke-width="1.5"/>
  <text x="445" y="95" font-size="12.5" text-anchor="middle" fill="#26293b">"at"</text>

  <rect x="500" y="70" width="90" height="40" rx="6" fill="#eef1f8" stroke="#7a8aa8" stroke-width="1.5"/>
  <text x="545" y="95" font-size="12.5" text-anchor="middle" fill="#26293b">"2:30"</text>

  <line x1="655" y1="90" x2="655" y2="128" stroke="#7a8aa8" stroke-width="2" stroke-dasharray="5,3"/>

  <rect x="720" y="70" width="200" height="40" rx="6" fill="#eef1f8" stroke="#7a8aa8" stroke-width="1.5"/>
  <text x="820" y="95" font-size="12.5" text-anchor="middle" fill="#26293b">"The doctor said..."</text>

  <!-- label row, spaced enough apart to never touch -->
  <text x="385" y="145" font-size="12" text-anchor="middle" fill="#7a8aa8">Timer 1 (short)</text>
  <text x="385" y="161" font-size="11.5" text-anchor="middle" fill="#7a8aa8">waits through this, no cut</text>

  <text x="655" y="145" font-size="12" text-anchor="middle" fill="#4a5a80" font-weight="600">Timer 2 (long)</text>
  <text x="655" y="161" font-size="11.5" text-anchor="middle" fill="#4a5a80" font-weight="600">marks end of thought</text>

  <text x="820" y="145" font-size="12" text-anchor="middle" fill="#8a90a5">New segment</text>
  <text x="820" y="161" font-size="11.5" text-anchor="middle" fill="#8a90a5">(unrelated topic)</text>

  <!-- bracket grouping everything before the long pause -->
  <path d="M 40 190 L 40 200 L 590 200 L 590 190" fill="none" stroke="#7a8aa8" stroke-width="2"/>
  <line x1="315" y1="200" x2="315" y2="232" stroke="#7a8aa8" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="165" y="242" width="300" height="60" rx="10" fill="#eef1f8" stroke="#7a8aa8" stroke-width="1.5"/>
    <text x="315" y="267" font-size="13" font-weight="600" text-anchor="middle" fill="#26293b">Stored as one complete unit</text>
    <text x="315" y="285" font-size="11.5" text-anchor="middle" fill="#5a6178">"I have an appointment at 2:30"</text>
  </g>

  <g>
    <rect x="40" y="322" width="900" height="130" rx="10" fill="#ffffff" stroke="#d8dce6" stroke-width="1.5"/>
    <text x="60" y="352" font-size="15" font-weight="600" fill="#26293b">Why two timers, not one</text>
    <text x="60" y="378" font-size="14" fill="#5a6178">One short timer (1.5s) captures sentences cleanly but stores a new fragment at every pause, choppy and disconnected.</text>
    <text x="60" y="401" font-size="14" fill="#5a6178">One long timer (3s) groups whole thoughts well but stores nothing until a long silence, so continuous speech becomes one blob.</text>
    <text x="60" y="428" font-size="14" fill="#4a5a80" font-weight="600">Two timers let each threshold do the job it's suited for: short for sentence boundaries, long for thought boundaries.</text>
  </g>

</svg>
