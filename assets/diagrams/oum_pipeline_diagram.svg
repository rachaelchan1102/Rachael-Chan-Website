<svg viewBox="16 22 882 316" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7a8aa8"/>
    </marker>
  </defs>

  <rect width="940" height="420" fill="#ffffff"/>

  <text x="40" y="42" font-size="13" font-weight="600" letter-spacing="1.5" fill="#4a5a80">SOURCES</text>

  <g>
    <rect x="30" y="55" width="190" height="70" rx="10" fill="#ffffff" stroke="#c7cfdd" stroke-width="1.5"/>
    <text x="125" y="82" font-size="13.5" font-weight="600" text-anchor="middle" fill="#26293b">Crowdsourced</text>
    <text x="125" y="100" font-size="13" text-anchor="middle" fill="#5a6178">admissions spreadsheets</text>
  </g>

  <g>
    <rect x="30" y="140" width="190" height="70" rx="10" fill="#ffffff" stroke="#c7cfdd" stroke-width="1.5"/>
    <text x="125" y="167" font-size="13.5" font-weight="600" text-anchor="middle" fill="#26293b">Official university</text>
    <text x="125" y="185" font-size="13" text-anchor="middle" fill="#5a6178">pages (targeted averages)</text>
  </g>

  <!-- both sources converge to one exact merge point, then a single arrow into Scrape -->
  <line x1="220" y1="90" x2="250" y2="132" stroke="#7a8aa8" stroke-width="2"/>
  <line x1="220" y1="175" x2="250" y2="132" stroke="#7a8aa8" stroke-width="2"/>
  <line x1="250" y1="132" x2="295" y2="132" stroke="#7a8aa8" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="295" y="86" font-size="13" font-weight="600" letter-spacing="1.5" fill="#4a5a80">PIPELINE</text>

  <g>
    <rect x="295" y="97" width="150" height="70" rx="10" fill="#ffffff" stroke="#c7cfdd" stroke-width="1.5"/>
    <text x="370" y="124" font-size="13.5" font-weight="600" text-anchor="middle" fill="#26293b">Scrape</text>
    <text x="370" y="142" font-size="12" text-anchor="middle" fill="#5a6178">pull raw records</text>
  </g>

  <line x1="445" y1="132" x2="475" y2="132" stroke="#7a8aa8" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="475" y="97" width="170" height="70" rx="10" fill="#ffffff" stroke="#c7cfdd" stroke-width="1.5"/>
    <text x="560" y="120" font-size="13.5" font-weight="600" text-anchor="middle" fill="#26293b">Clean</text>
    <text x="560" y="138" font-size="12" text-anchor="middle" fill="#5a6178">standardize format,</text>
    <text x="560" y="153" font-size="12" text-anchor="middle" fill="#5a6178">dedupe, fill gaps</text>
  </g>

  <line x1="645" y1="132" x2="675" y2="132" stroke="#7a8aa8" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="675" y="97" width="200" height="70" rx="10" fill="#eef1f8" stroke="#7a8aa8" stroke-width="1.5"/>
    <text x="775" y="120" font-size="13.5" font-weight="600" text-anchor="middle" fill="#26293b">Normalize</text>
    <text x="775" y="138" font-size="12" text-anchor="middle" fill="#5a6178">token-set matching</text>
    <text x="775" y="153" font-size="12" text-anchor="middle" fill="#5a6178">across 21 universities</text>
  </g>

  <line x1="775" y1="167" x2="775" y2="255" stroke="#7a8aa8" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="242" font-size="13" font-weight="600" letter-spacing="1.5" fill="#4a5a80">RESULT</text>

  <g>
    <rect x="675" y="255" width="200" height="70" rx="10" fill="#ffffff" stroke="#c7cfdd" stroke-width="1.5"/>
    <text x="775" y="282" font-size="13.5" font-weight="600" text-anchor="middle" fill="#26293b">PostgreSQL</text>
    <text x="775" y="300" font-size="12" text-anchor="middle" fill="#5a6178">single reconciled dataset</text>
  </g>

  <line x1="675" y1="290" x2="600" y2="290" stroke="#7a8aa8" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="380" y="255" width="220" height="70" rx="10" fill="#eef1f8" stroke="#7a8aa8" stroke-width="1.5"/>
    <text x="490" y="282" font-size="13.5" font-weight="600" text-anchor="middle" fill="#26293b">Platform</text>
    <text x="490" y="300" font-size="12" text-anchor="middle" fill="#5a6178">reported vs. official cutoffs</text>
  </g>

  <line x1="380" y1="290" x2="230" y2="290" stroke="#7a8aa8" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="30" y="255" width="200" height="70" rx="10" fill="#ffffff" stroke="#c7cfdd" stroke-width="1.5"/>
    <text x="130" y="282" font-size="13.5" font-weight="600" text-anchor="middle" fill="#26293b">Student searches</text>
    <text x="130" y="300" font-size="12" text-anchor="middle" fill="#5a6178">any program, 600+ covered</text>
  </g>

</svg>
