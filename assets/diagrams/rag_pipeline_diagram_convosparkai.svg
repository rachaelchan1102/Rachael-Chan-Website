<svg viewBox="0 0 940 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7a8aa8"/>
    </marker>
  </defs>

  <rect width="940" height="480" fill="#ffffff"/>

  <text x="40" y="35" font-size="13" font-weight="600" letter-spacing="1.5" fill="#4a5a80">STORAGE</text>

  <g>
    <rect x="30" y="55" width="150" height="70" rx="10" fill="#ffffff" stroke="#c7cfdd" stroke-width="1.5"/>
    <text x="105" y="82" font-size="14" font-weight="600" text-anchor="middle" fill="#26293b">Phrase</text>
    <text x="105" y="100" font-size="14" font-weight="600" text-anchor="middle" fill="#26293b">spoken</text>
  </g>

  <line x1="180" y1="90" x2="222" y2="90" stroke="#7a8aa8" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="225" y="55" width="180" height="70" rx="10" fill="#ffffff" stroke="#c7cfdd" stroke-width="1.5"/>
    <text x="315" y="82" font-size="13.5" font-weight="600" text-anchor="middle" fill="#26293b">Stored verbatim</text>
    <text x="315" y="100" font-size="13.5" text-anchor="middle" fill="#5a6178">in SQLite + timestamp</text>
  </g>

  <line x1="405" y1="90" x2="447" y2="90" stroke="#7a8aa8" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="450" y="55" width="200" height="70" rx="10" fill="#ffffff" stroke="#c7cfdd" stroke-width="1.5"/>
    <text x="550" y="82" font-size="13.5" font-weight="600" text-anchor="middle" fill="#26293b">Converted to embedding</text>
    <text x="550" y="100" font-size="12.5" text-anchor="middle" fill="#5a6178">text-embedding-3-small</text>
  </g>

  <line x1="650" y1="90" x2="692" y2="90" stroke="#7a8aa8" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="695" y="55" width="215" height="70" rx="10" fill="#eef1f8" stroke="#7a8aa8" stroke-width="1.5"/>
    <text x="802" y="82" font-size="13.5" font-weight="600" text-anchor="middle" fill="#26293b">Sits in database</text>
    <text x="802" y="100" font-size="12.5" text-anchor="middle" fill="#5a6178">waiting for a question</text>
  </g>

  <line x1="802" y1="125" x2="802" y2="175" stroke="#7a8aa8" stroke-width="2"/>
  <line x1="802" y1="175" x2="802" y2="217" stroke="#7a8aa8" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="195" font-size="13" font-weight="600" letter-spacing="1.5" fill="#4a5a80">RECALL</text>

  <g>
    <rect x="30" y="215" width="180" height="70" rx="10" fill="#ffffff" stroke="#c7cfdd" stroke-width="1.5"/>
    <text x="120" y="242" font-size="13.5" font-weight="600" text-anchor="middle" fill="#26293b">User asks a</text>
    <text x="120" y="260" font-size="13.5" font-weight="600" text-anchor="middle" fill="#26293b">question</text>
  </g>

  <line x1="210" y1="250" x2="252" y2="250" stroke="#7a8aa8" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="255" y="215" width="180" height="70" rx="10" fill="#ffffff" stroke="#c7cfdd" stroke-width="1.5"/>
    <text x="345" y="242" font-size="13.5" font-weight="600" text-anchor="middle" fill="#26293b">Question is</text>
    <text x="345" y="260" font-size="13.5" text-anchor="middle" fill="#5a6178">embedded too</text>
  </g>

  <line x1="435" y1="250" x2="477" y2="250" stroke="#7a8aa8" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="480" y="215" width="215" height="70" rx="10" fill="#ffffff" stroke="#c7cfdd" stroke-width="1.5"/>
    <text x="587" y="238" font-size="13" font-weight="600" text-anchor="middle" fill="#26293b">Compared via cosine</text>
    <text x="587" y="256" font-size="13" text-anchor="middle" fill="#5a6178">similarity to stored pieces</text>
    <text x="587" y="273" font-size="11.5" text-anchor="middle" fill="#7a8aa8">closest matches pulled</text>
  </g>

  <line x1="695" y1="250" x2="737" y2="250" stroke="#7a8aa8" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="740" y="215" width="170" height="70" rx="10" fill="#ffffff" stroke="#c7cfdd" stroke-width="1.5"/>
    <text x="825" y="242" font-size="13" font-weight="600" text-anchor="middle" fill="#26293b">Only those</text>
    <text x="825" y="260" font-size="13" font-weight="600" text-anchor="middle" fill="#26293b">pieces sent</text>
  </g>

  <line x1="825" y1="285" x2="825" y2="335" stroke="#7a8aa8" stroke-width="2"/>
  <line x1="825" y1="335" x2="825" y2="367" stroke="#7a8aa8" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="345" font-size="13" font-weight="600" letter-spacing="1.5" fill="#4a5a80">ANSWER</text>

  <g>
    <rect x="270" y="365" width="600" height="90" rx="10" fill="#eef1f8" stroke="#7a8aa8" stroke-width="1.5"/>
    <text x="570" y="398" font-size="14.5" font-weight="600" text-anchor="middle" fill="#26293b">Model answers using only the retrieved context</text>
    <text x="570" y="422" font-size="13" text-anchor="middle" fill="#5a6178">Says "not found" instead of guessing if the answer isn't there</text>
  </g>

  <line x1="270" y1="410" x2="210" y2="410" stroke="#7a8aa8" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="30" y="380" width="180" height="60" rx="10" fill="#ffffff" stroke="#c7cfdd" stroke-width="1.5"/>
    <text x="120" y="405" font-size="13.5" font-weight="600" text-anchor="middle" fill="#26293b">Shown to user</text>
    <text x="120" y="423" font-size="13" text-anchor="middle" fill="#5a6178">in the app</text>
  </g>

</svg>
