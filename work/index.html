<span>R. Chan</span>

<div style="display:flex;flex-direction:column">

<div style="flex:1;border-top:1px solid #c9c5ba;border-bottom:1px solid #c9c5ba;padding:12px 0"><p style="margin:0;font:400 13px/1.6 'IBM Plex Mono',monospace;color:#3d3e42;text-wrap:pretty">{{ r.reflection }}</p><sc-if value="{{ r.img1 }}" hint-placeholder-val="{{ false }}"><div style="margin-top:12px;padding-top:12px;border-top:1px solid #c9c5ba"><img src="{{ r.img1 }}" alt="{{ r.img1Alt }}" style="width:100%;aspect-ratio:16/9;object-fit:{{ r.imgFit }};object-position:center 65%;background:{{ r.imgBg }};display:block"></div></sc-if></div>

<div class="colR" style="display:flex;flex-direction:column;padding-left:32px">

</div>
</div>
</div>
<sc-if value="{{ r.gallery }}" hint-placeholder-val="{{ true }}"><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:560px">
<div style="position:relative;aspect-ratio:{{ r.imgRatio }};grid-column:{{ r.imgSpan }};border:1px solid #c9c5ba;background:#ebe7de;overflow:hidden"><sc-if value="{{ r.img1 }}" hint-placeholder-val="{{ false }}"><img src="{{ r.img1 }}" alt="{{ r.img1Alt }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block"></sc-if><sc-if value="{{ r.noImg1 }}" hint-placeholder-val="{{ true }}"><image-slot id="work-{{ r.key }}-1" shape="rect" fit="cover" placeholder="Drop an image" style="position:absolute;inset:0;width:100%;height:100%;display:block"></image-slot></sc-if></div>

</div></sc-if>

</div>
</div>
</div>
</sc-for>
</div>

<footer style="margin-top:60px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:16px;border-top:1.5px solid #26272a;font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#5d5f63">
<span>TORONTO, ON</span>
<span style="display:flex;gap:16px"><a href="https://github.com/rachaelchan1102" target="_blank" rel="noopener">GITHUB</a><a href="https://linkedin.com/in/rachael-chan-01726b334/" target="_blank" rel="noopener">LINKEDIN</a><a href="mailto:rachaelchan1102@gmail.com" target="_blank" rel="noopener">EMAIL</a></span>
</footer>
</main>
<div id="leaveFade" style="position:fixed;inset:0;z-index:80;background:#f3f0e8;opacity:0;pointer-events:none;transition:opacity .5s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:600 12px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#5d5f63"><span>← BACK TO LINE</span><span style="width:180px;height:2px;background:#c9c5ba;display:block;position:relative;overflow:hidden"><span id="leaveBar" style="position:absolute;left:0;top:0;bottom:0;width:0;background:#f0561d;display:block;transition:width .55s linear .1s"></span></span></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const DATA = [
  { href: 'work-yncn.dc.html', noImages: true, logo: '/assets/logos/logo-yncn.png', role: 'Data Engineer', company: 'You’re Next Career Network', kind: 'Extracurricular', dates: 'MAY 2026 – PRESENT',
    focus: 'Building semantic matching for a student-recruiter career fair platform.',
    tags: ['NLP', 'Python', 'Semantic Search', 'Data Engineering'],
    reflection: 'I joined because I wanted to help make the career search easier for students at UofT, and I liked the idea of building something that could actually contribute to that. What I didn’t expect was how much I’d get out of the club itself. Working the career fairs, I met so many students, recruiters, and teammates who were all chasing the same goal of landing jobs and helping each other get there. Hearing from them directly shaped how I thought about the products I was building, and being around people that driven has made the whole job search feel a lot less lonely.',
    bullets: ['Served as a club representative to employer and recruiter partners, volunteering across career fairs and networking initiatives to help students access job opportunities.', 'Owned semantic matching for the Career Fair’s Unified Data Engine, a co-built recruiter platform, using OpenAI embeddings to match students to job descriptions across recruiters.', 'Implemented Supabase authentication and role-based access control, securing recruiter and student data and enforcing separate permission scopes across the platform.'] },
  { href: 'work-ai-data-intern.dc.html', img1: '/assets/work/pi-intern-presentation.jpg', img1Alt: 'Rachael and fellow interns at their summer internship presentation, Developing AI Skill Library', logo: '/assets/logos/logo-constellation.png', role: 'Process Improvement Intern', company: 'Constellation Homebuilder Systems', kind: 'Internship', dates: 'MAY – AUG 2026',
    focus: 'Automating data product development and data workflows.',
    tags: ['React', 'Microsoft Fabric', 'Automation', 'Python'],

    bullets: ['Redesigned a manual benchmarking data workflow into a shorter process by using failure mode analysis to build validation safeguards into a Python automation and cut rework.', 'Built AI agents that generate complete Power BI paginated reports and dashboards over an MCP server, cutting report creation time and greatly increasing how many reports the team can deliver.', 'Cleared a bottleneck caused by manually re-entering client goals by mapping the process with flow diagrams, then building a client-facing React portal for direct data entry.'] },
  { href: 'work-utfr.dc.html', img1: '/assets/work/utfr-car.png', img1Alt: 'University of Toronto Formula Racing car at the Michigan competition track', logo: '/assets/logos/logo-utfr.png', role: 'Senior Race Engineering Member', company: 'UofT Formula Racing Team', kind: 'Extracurricular', dates: 'JAN 2026 – PRESENT',
    focus: 'Data infrastructure and analysis for race performance improvements.',
    tags: ['SQL', 'Power BI', 'Telemetry', 'Algorithms'],
    reflection: 'Joining a design team showed me how much a group of undergrad students can actually build, and it pushed me to keep learning well beyond what we cover in class. On the race engineering side, the work is about squeezing as much as possible out of the car, and digging through the data to find where the next bit of performance is hiding.',
    bullets: ['Analyzed high-frequency driver telemetry (MoTeC) with root cause analysis, building SQL pipelines and Power BI KPI dashboards that pinpointed throttle-control gaps and informed targeted improvements across sessions.', 'Built a speed-threshold classifier in Python that automatically segments session data into driving stints, cutting manual data preparation and producing standardized datasets for the dashboards.', 'Assisted with on-track testing, recording test data for the team’s data management, and helped manufacture car parts through manual machining.'] },
  { href: 'work-findnext.dc.html', img1: '/assets/work/tpm-meal-system.png', img1Alt: 'CAD model of the heated-plate meal system with dimensions', imgFit: 'contain', imgBg: '#ffffff', logo: '/assets/logos/logo-findnext.png', role: 'Technical Project Manager', company: 'FindNext Inc.', kind: 'Internship', dates: 'JAN – APR 2026',
    focus: 'Led design lifecycle for a meal assistive device.',

    reflection: 'This was my first time taking a project from client requirements all the way to a working prototype. I loved the PM side: talking with clients, turning their needs into project requirements and conceptual design specifications, and sketching more than a hundred ideas before we narrowed them down. Later, running time studies on our own assembly and comparing suppliers showed me that the way something is built and sourced matters as much as the design itself, and it’s what got me interested in physical products and the processes behind them.',
    bullets: ['Led a cross-functional team as project manager for a meal assistive device, driving the full design lifecycle from definition through prototyping and narrowing 128 ideas to a final client-ready design.', 'Defined design requirements by communicating directly with the client and care-setting stakeholders to gather and translate their needs into project specifications.', 'Reduced prototype assembly and cleaning time by 35% by conducting time studies to identify bottlenecks and applying DFA principles in SolidWorks to consolidate 4 assemblies into 2.', 'Lowered projected BOM cost per unit 13% by sourcing each component from the lowest-cost ISO 9001-certified supplier that met temperature, dimensional and food-grade material requirements.', 'Validated the heat retention performance of the selected design against client specifications using Arduino-based temperature sensors.'] },
  { href: 'work-constellation-analyst.dc.html', img1: '/assets/work/analyst-interns.png', img1Alt: 'Rachael with the Constellation Homebuilder Systems intern cohort', logo: '/assets/logos/logo-constellation.png', role: 'Data Analyst Intern', company: 'Constellation Homebuilder Systems', kind: 'Internship', dates: 'MAY – AUG 2025',
    focus: 'Dashboards, reports, and standardizing legacy data for business decisions.',
    tags: ['SQL', 'SSRS', 'Data Warehouse', 'Reporting'],
    reflection: 'I built everything here mostly manually, before AI was built into every IDE and super integrated in my workflows. It was slow, but it meant I truly understood every step of how raw records turned into a report. It also gave me a baseline: a year later, I could see exactly how much of that work could be automated.',
    bullets: ['Built a SQL and SSRS pipeline that transforms raw ticket and time log data into client-ready invoices with budget vs. billed breakdowns, replacing hours of manual reporting each month.', 'Developed an SSRS report that aggregates over a million ticket and defect records into one place, making it much faster to look up past issues.', 'Unified four legacy systems into a data warehouse, standardizing schemas to enable consistent downstream reporting.'] },
  { href: 'work-mftga.dc.html', img1: '/assets/work/mftga-volunteers.png', img1Alt: 'Music for the Golden Age volunteer musicians with the program banner at a long-term care home', logo: '/assets/logos/logo-mftga.png', role: 'Co-Founder & Operations Lead', company: 'Music for the Golden Age', kind: 'Extracurricular', dates: 'JUL 2022 – PRESENT',

    bullets: ['Helped grow our volunteer music program from zero to seven long-term care homes, building partnerships with each home and recruiting and onboarding volunteer musicians.', 'Run scheduling, staffing, and transportation across all seven homes, assigning musicians under pianist-coverage and minimum-staffing requirements and backfilling last-minute cancellations.', 'Built RosterFlow, an optimization and simulation tool that plans our shows, schedules backup volunteers, and groups musicians into shared rides.'] }

        return Object.assign({}, p, { idx: idx, key: p.href.replace('work-', '').replace('.dc.html', ''), open: open, rows: open ? '1fr' : '0fr', op: open ? '1' : '0', tr: self.state.instant ? 'none' : 'grid-template-rows .55s cubic-bezier(.2,.8,.2,1),opacity .4s ease', moreLabel: open ? 'CLOSE −' : 'LEARN MORE +', bullets: p.bullets || [], img1: p.img1 || '', img1Alt: p.img1Alt || '', noImg1: !p.img1, gallery: !p.img1 && !p.noImages, imgFit: p.imgFit || 'cover', imgBg: p.imgBg || 'transparent', imgRatio: p.img1 ? '4/3' : '4/3', imgSpan: p.img1 ? '1 / -1' : 'auto',
          toggle: function () { self.setState({ open: open ? null : idx }); } });
